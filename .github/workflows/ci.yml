name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Tool versions — must match docs/toolchain.md
  NODE_VERSION: "22.9.0"
  PNPM_VERSION: "9.11.0"
  CMAKE_VERSION: "3.29.6"
  NINJA_VERSION: "1.12.1"
  EMSDK_VERSION: "3.1.67"

jobs:
  # ---------------------------------------------------------------------------
  # Native C++ build and unit tests
  # ---------------------------------------------------------------------------
  native:
    name: Native C++ (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build clang-format-18 clang-tidy-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: native-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: native-deps-

      - name: Configure (native-release)
        run: cmake --preset native-release

      - name: Build
        run: cmake --build --preset native-release

      - name: Run unit tests
        run: ctest --preset native --output-on-failure

  # ---------------------------------------------------------------------------
  # clang-format check
  # ---------------------------------------------------------------------------
  format:
    name: C++ format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install clang-format-18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Check formatting
        run: |
          find engine/src engine/include engine/tests bridge/src \
            -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # SvelteKit typecheck and lint
  # ---------------------------------------------------------------------------
  web-check:
    name: Web typecheck and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ hashFiles('apps/web/package.json') }}
          restore-keys: pnpm-

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Svelte sync
        working-directory: apps/web
        run: pnpm exec svelte-kit sync

      - name: Typecheck
        working-directory: apps/web
        run: pnpm check

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

  # ---------------------------------------------------------------------------
  # WASM build
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM build (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Cache Emscripten SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          if [ ! -d "$HOME/.emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/.emsdk"
          fi
          cd "$HOME/.emsdk"
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Cache CMake FetchContent dependencies (WASM)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: wasm-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: wasm-deps-

      - name: Configure (wasm-release)
        run: |
          source "$HOME/.emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release

      - name: Build WASM
        run: |
          source "$HOME/.emsdk/emsdk_env.sh"
          cmake --build --preset wasm-release

      - name: Verify WASM artifacts exist
        run: |
          test -f apps/web/static/wasm/market_classifier.js
          test -f apps/web/static/wasm/market_classifier.wasm
          echo "WASM artifacts present."

      - name: Report artifact sizes
        run: |
          echo "=== WASM artifact sizes ==="
          ls -lh apps/web/static/wasm/
          echo ""
          echo "=== Compressed sizes ==="
          gzip -kf apps/web/static/wasm/market_classifier.js
          gzip -kf apps/web/static/wasm/market_classifier.wasm
          ls -lh apps/web/static/wasm/*.gz

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-release
          path: apps/web/static/wasm/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # SvelteKit web build (depends on WASM for full build; runs independently for lint/check)
  # ---------------------------------------------------------------------------
  web-build:
    name: Web build
    runs-on: ubuntu-24.04
    needs: [wasm, web-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ hashFiles('apps/web/package.json') }}
          restore-keys: pnpm-

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-release
          path: apps/web/static/wasm/

      - name: Build SvelteKit
        working-directory: apps/web
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Playwright smoke tests (depends on web build)
  # ---------------------------------------------------------------------------
  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-24.04
    needs: [web-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-release
          path: apps/web/static/wasm/

      - name: Run Playwright smoke tests
        working-directory: apps/web
        run: pnpm test

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
