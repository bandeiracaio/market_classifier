name: Pages

# Builds the WASM terminal and the static SvelteKit host and deploys them to GitHub
# Pages (packet §11). Runs on pushes to main only; CI (ci.yml) gates quality.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Tool versions — must match docs/toolchain.md
  NODE_VERSION: "22.9.0"
  PNPM_VERSION: "9.11.0"
  CMAKE_VERSION: "3.29.6"
  NINJA_VERSION: "1.12.1"
  EMSDK_VERSION: "3.1.67"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Cache Emscripten SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          if [ ! -d "$HOME/.emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/.emsdk"
          fi
          cd "$HOME/.emsdk"
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Build WASM
        run: |
          source "$HOME/.emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release
          cmake --build --preset wasm-release

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build SvelteKit (Pages base path)
        working-directory: apps/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
